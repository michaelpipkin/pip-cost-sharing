<h1 mat-dialog-title data-testid="update-prompt-title">
  <span>Update Required</span>
</h1>
<mat-dialog-content data-testid="update-prompt-content">
  <p>
    This version of PipSplit is no longer supported. Please update to the latest
    version to keep using the app.
  </p>
  <p data-testid="update-prompt-web-note">
    If your phone runs a version older than Android 7, or you otherwise can't
    install the update, you can always use PipSplit in your web browser at
    <a
      [href]="webAppUrl"
      target="_blank"
      (click)="openWebApp($event)"
      data-testid="update-prompt-web-link"
      >pipsplit.com</a
    >.
  </p>
</mat-dialog-content>
<mat-dialog-actions data-testid="update-prompt-actions">
  <button
    mat-raised-button
    class="btn-secondary"
    type="button"
    (click)="openStoreListing()"
    data-testid="update-prompt-update-button"
    aria-label="Update"
  >
    Update
  </button>
</mat-dialog-actions>
